services:
  postgres:
    image: postgres:16
    container_name: postgres-container
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres-volume:/var/lib/postgresql/data
    restart: always
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${POSTGRES_USER}" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - curriculo-network
  curriculoai-app:
    build: ./
    container_name: backend-spring-container
    restart: always
    depends_on:
      postgres:
          condition: service_healthy
    ports:
      - "8080:8080"
    env_file:
      - .env
    networks:
      - curriculo-network


volumes:
  postgres-volume:
networks:
  curriculo-network: